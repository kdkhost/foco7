---
deployment:
  tasks:
    - export DEPLOYPATH=/home/fococomb/public_html/
    - /bin/mkdir -p $DEPLOYPATH/public/uploads/banners $DEPLOYPATH/public/uploads/depoimentos $DEPLOYPATH/public/uploads/app $DEPLOYPATH/public/uploads/manutencao $DEPLOYPATH/public/uploads/branding $DEPLOYPATH/public/uploads/parceiros $DEPLOYPATH/public/uploads/estetica $DEPLOYPATH/public/uploads/avatares
    - /bin/mkdir -p $DEPLOYPATH/storage/app/public/uploads
    - /bin/rsync -av --exclude='.git' --exclude='.env' --exclude='storage/logs/*.log' --exclude='public/uploads/*' --exclude='storage/app/public/*' ./ $DEPLOYPATH
    - /bin/chmod -R 775 $DEPLOYPATH/public/uploads $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache
    - /bin/chmod -R 755 $DEPLOYPATH/public
    - cd $DEPLOYPATH && php artisan storage:link || true
    - cd $DEPLOYPATH && php artisan view:clear && php artisan cache:clear && php artisan route:clear && php artisan config:clear || true
